    <title>Farfield — prova voxel</title>
    <!-- The world's own mark, so a browser asking for /favicon.ico is
         answered instead of writing a 404 into the one console this page
         exists to be read in. Same data URI as index.html. -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230f1720'/%3E%3Cpath d='M16 5.5 26.5 16 16 26.5 5.5 16Z' fill='none' stroke='%237fd4f5' stroke-width='1.6'/%3E%3Cpath d='M16 11 21 16 16 21 11 16Z' fill='%239eecf9'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/src/ui/style.css" />
    <!--
      A PAGE OF ITS OWN, AND NOT A FLAG ON THE WORLD'S.

      src/dev/baketest.js is the precedent for where this lives and for how it
      is kept out of a delivery, but not for how it is reached. That one hangs a
      single model on the finished hub; this one has to answer what ONE CORNER
      costs — twenty draw calls and forty thousand triangles — and a corner
      measured inside the whole standing world is not a corner, it is the world
      plus a corner. So the scene is built here, and the numbers are about what
      is in it.

      It also means src/main.js is not touched. Nothing under src/world/ or
      src/core/ is either: everything below imports them. Delete this file and
      its two neighbours and the tree is exactly what it was.

      The build never sees it. Vite's only input is index.html at the root, so
      an HTML file sitting in src/ is not an entry, is not bundled, and cannot
      reach a visitor however the flags are set.
    -->
    <style>
      .vox-note {
        position: fixed;
        right: 12px;
        bottom: 12px;
        max-width: 22rem;
        padding: 10px 12px;
        font: 300 11px/1.55 'Farfield Sans', 'Segoe UI', sans-serif;
        color: #bee8fd;
        background: rgba(8, 14, 20, 0.72);
        border: 1px solid rgba(160, 210, 235, 0.22);
        white-space: pre-line;
        pointer-events: none;
      }
      .vox-note b { color: #9eecf9; font-weight: 500; }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div id="ui"></div>

  </body>
