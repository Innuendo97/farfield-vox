    <!-- The way out of the world, for a reader the world cannot carry: no
         script, no WebGL2, or a screen with no keyboard to walk with. It is
         written here rather than in the interface sheet because it has to stand
         on its own — with scripting off, nothing of src/ has run. -->
    <style>
      .away {
        position: fixed;
        inset: 0;
        z-index: 40;
        display: grid;
        place-content: center;
        gap: 0.9rem;
        justify-items: center;
        padding: 2rem;
        text-align: center;
        background: radial-gradient(120% 80% at 50% 0%, #16283a 0%, #0f1720 62%);
        font-family: 'Farfield Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        color: #bee8fd;
      }
      .away h1 {
        margin: 0;
        font-size: 1.6rem;
        font-weight: 200;
        letter-spacing: 0.34em;
        margin-right: 0.34em;
        text-transform: uppercase;
        color: #e6f4fb;
      }
      .away p { margin: 0; max-width: 30rem; font-weight: 300; line-height: 1.6; }
      .away a {
        margin-top: 0.5rem;
        padding: 0.55rem 1.2rem;
        border: 1px solid rgba(202, 238, 255, 0.42);
        font-size: 0.95rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        text-decoration: none;
        color: #9eecf9;
      }
      .away a:hover { border-color: #9eecf9; }
    </style>
